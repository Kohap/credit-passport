name: Assemble Desk Main
on:
  push:
    paths:
      - '.assemble/desk-part-a.txt'
      - '.assemble/desk-part-b.txt'
      - '.github/workflows/assemble-desk-main.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble Desk.tsx onto main
        run: |
          cat .assemble/desk-part-a.txt .assemble/desk-part-b.txt > apps/web/src/components/Desk.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/Desk.tsx
          git diff --cached --quiet || git commit -m "fix(web): restore Desk.tsx (replace PLACEHOLDER)"
          git push origin HEAD:main
