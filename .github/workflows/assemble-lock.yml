name: Assemble package-lock
on:
  workflow_dispatch:
  push:
    paths:
      - '.lock-b64/**'
      - '.github/workflows/assemble-lock.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble lockfile
        run: |
          set -euo pipefail
          cat .lock-b64/part-* | base64 -d | gunzip -c > package-lock.json
          actual=$(wc -c < package-lock.json)
          echo "size=$actual"
          test "$actual" -eq 306686
          echo e827460c0d636b7d959c0bdaee52772b7f58c70914f96425dfd56c5041369b12  package-lock.json | sha256sum -c -
      - name: Commit package-lock.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm -r --ignore-unmatch .lock-b64
          git rm -f --ignore-unmatch .github/workflows/assemble-lock.yml
          git commit -m "Add package-lock.json for GitHub Actions npm ci"
          git push
