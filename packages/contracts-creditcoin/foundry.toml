[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
verbosity = 2
allow_paths = ["node_modules", "lib"]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@gluwa/asc-contracts/=node_modules/@gluwa/asc-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[lint]
lint_on_build = false

[rpc_endpoints]
creditcoin = "${CREDITCOIN_RPC_URL}"
